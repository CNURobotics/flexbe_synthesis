/data:
    spec_name: 'req:spec_name'        # Use name assigned by request, or string here
    spec_path: 'ros:spec_path'        # Use ROS 2 parameter or full path here
    verbose: 'ros:verbose'            # pass verbose:=true at launch to enable diagnostic output
    synthesis_timeout_s: 60.0         # Override default 15-minute Slugs timeout for examples
    variable_ordering_mode: 'alphabetic'
    variable_ordering_seed: 0
    reordering_enabled: true
    well_separation_timeout_s: 60.0
    fail_on_non_well_separated: false
    fail_on_incomplete: true
    minimize_well_separation_core: false
    strategy_auditor_spec_path: ''    # Empty means use generated compiled .slugsin
    strategy_auditor_goal_outcomes: [] # Empty means derive from mapped SM outcomes
    strategy_auditor_timeout_s: 5.0
    use_fallback_layout: true         # set true to skip pygraphviz layout (faster, lower quality)
    max_reduction_sweeps: null        # null means sweep reduction until fixed point
    reduced_automaton_name: 'slugs_automaton_reduced'
    mealy_graph_config:
        draw_graph: false
        layout: 'dot'
        splines: true
        initial_state: true
        font_size: 6
        penwidth: 2.0
        env_node_size: 0.4
        sys_node_size: 0.1
        dpi: 150
        show_node_ids: true
        sys_choice_edge_color: 'green'
        env_choice_edge_color: 'red'
