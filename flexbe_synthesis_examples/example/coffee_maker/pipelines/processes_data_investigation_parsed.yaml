/data:
    spec_name: 'req:spec_name'        # Use name assigned by request, or string here
    spec_path: 'ros:spec_path'        # Use ROS 2 parameter or full path here
    verbose: 'ros:verbose'            # pass verbose:=true at launch to enable diagnostic output
    synthesis_timeout_s: 60.0         # Override default 15-minute Slugs timeout for examples
    well_separation_timeout_s: 60.0
    fail_on_non_well_separated: false
    fail_on_incomplete: true
    minimize_well_separation_core: false
    strategy_auditor_spec_path: ''    # Empty means use generated compiled .slugsin
    # Issue 1 investigation, parsed/enumerated-encoding variant: the enumerated
    # encoding generalizes per-capability outcomes (bd_c/gr_c/br_c) into plain
    # `completed`/`failure` inputs, so `br_c` never matches here. `completed` is a
    # weaker goal criterion than the one-hot runs' `br_c` (it fires on ANY capability
    # completing, not specifically brewing), but it's the only outcome-side signal
    # this encoding exposes, and still catches "never completes anything" livelocks.
    strategy_auditor_goal_outcomes: ['completed']
    strategy_auditor_timeout_s: 30.0   # raised from 5s default; should no longer be needed
                                        # to hit 120s now that the counter-explosion fix lands.
    use_fallback_layout: false        # set true to skip pygraphviz layout (faster, lower quality)
    reduced_automaton_name: 'coffee_automaton_reduced'
    mealy_graph_config:
        draw_graph: true
        layout: 'dot'
        splines: true
        initial_state: true
        font_size: 6
        penwidth: 2.0
        env_node_size: 0.4
        sys_node_size: 0.1
        dpi: 150
        show_node_ids: true
        sys_choice_edge_color: 'green'
        env_choice_edge_color: 'red'
